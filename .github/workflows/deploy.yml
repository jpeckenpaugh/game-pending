name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      showcase:
        description: Generate and publish the video and promotional gallery
        type: boolean
        required: false
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run browser smoke test
        env:
          SHOWCASE: ${{ inputs.showcase }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$SHOWCASE" = "true" ]; then
            ./test-runner/run.sh --showcase
          else
            ./test-runner/run.sh
          fi

      - name: Upload smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-test-artifacts
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages site and preserve or refresh demo media
        env:
          SHOWCASE: ${{ inputs.showcase }}
        run: |
          mkdir -p _site/demos/latest
          cp -R html/. _site/
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$SHOWCASE" = "true" ]; then
            cp test-artifacts/demo.webm _site/demos/latest/demo.webm
            cp test-artifacts/0[1-8]-*.png _site/demos/latest/
            cp -R test-artifacts/gallery _site/demos/latest/gallery
          else
            python3 .github/scripts/preserve-pages-media.py
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
